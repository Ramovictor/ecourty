<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<header th:fragment="header" class="easy-header">

    <div class="easy-header-container">

        <!-- LOGO -->

        <a th:href="@{/}" class="easy-logo">

            <img
                th:src="@{/images/logo.png}"
                alt="easycourty"
            >

        </a>


        <!-- MENU -->

        <nav class="easy-nav">

            <a
                th:href="@{/}"
                class="easy-nav-item"
            >
                <i class="bi bi-house-door"></i>
                <span>Início</span>
            </a>


            <a
                th:href="@{/quadras}"
                class="easy-nav-item"
            >
                <i class="bi bi-grid-3x3-gap"></i>
                <span>Quadras</span>
            </a>


            <a
                th:href="@{/agendamentos}"
                class="easy-nav-item"
            >
                <i class="bi bi-calendar3"></i>
                <span>Agendamentos</span>
            </a>


            <a
                th:href="@{/clientes}"
                class="easy-nav-item"
            >
                <i class="bi bi-people"></i>
                <span>Clientes</span>
            </a>

        </nav>


        <!-- USUÁRIO -->

        <div class="easy-user">

            <div class="easy-user-icon">
                <i class="bi bi-person"></i>
            </div>

            <div class="easy-user-info">

                <span class="easy-user-small">
                    Olá,
                </span>

                <strong>
                    Usuário
                </strong>

            </div>

            <i class="bi bi-chevron-down easy-user-arrow"></i>

        </div>

    </div>


    <style>

        /* =====================================================
           EASYCOURTY - HEADER
        ===================================================== */

        .easy-header {
            width: 100%;
            height: 72px;

            background: #001030;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            position: sticky;
            top: 0;
            z-index: 1000;
        }


        .easy-header-container {
            max-width: 1380px;
            height: 100%;

            margin: 0 auto;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }


        /* LOGO */

        .easy-logo {
            width: 145px;
            height: 62px;

            display: flex;
            align-items: center;

            overflow: hidden;

            flex-shrink: 0;
        }

        .easy-logo img {
            width: 145px;
            height: 70px;

            object-fit: cover;

            display: block;
        }


        /* MENU */

        .easy-nav {
            height: 100%;

            display: flex;
            align-items: center;
            gap: 5px;

            flex: 1;
        }


        .easy-nav-item {
            position: relative;

            height: 100%;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            color: #D8E2F2;

            font-family: "Inter", sans-serif;
            font-size: 13px;
            font-weight: 500;

            transition: all 0.2s ease;
        }


        .easy-nav-item i {
            font-size: 16px;
        }


        .easy-nav-item:hover {
            color: #FFFFFF;
        }


        .easy-nav-item:hover::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 16px;
            right: 16px;

            height: 3px;

            background: #0050E0;

            border-radius: 5px 5px 0 0;
        }


        /* USUÁRIO */

        .easy-user {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            flex-shrink: 0;
        }


        .easy-user-icon {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #0050E0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 17px;
        }


        .easy-user-info {
            display: flex;
            flex-direction: column;

            line-height: 1.1;
        }


        .easy-user-small {
            font-size: 10px;
            color: #AFC0D8;
        }


        .easy-user-info strong {
            font-size: 12px;
            font-weight: 600;
        }


        .easy-user-arrow {
            color: #AFC0D8;
            font-size: 12px;
        }


        /* RESPONSIVO */

        @media (max-width: 900px) {

            .easy-header {
                height: auto;
            }

            .easy-header-container {
                min-height: 70px;
                flex-wrap: wrap;
                padding: 8px 18px;
            }

            .easy-nav {
                order: 3;

                width: 100%;
                height: 48px;

                justify-content: center;
            }

            .easy-nav-item {
                padding: 0 10px;
            }

            .easy-nav-item span {
                display: none;
            }

            .easy-logo {
                width: 125px;
            }

            .easy-logo img {
                width: 125px;
            }

            .easy-user-info,
            .easy-user-arrow {
                display: none;
            }
        }

    </style>

</header>

</body>
</html>
