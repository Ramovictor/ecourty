<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - easycourty</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --azul: #0050E0;
            --azul-forte: #0064F0;
            --azul-escuro: #001030;

        }


        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #F3F7FF,
                    #FFFFFF,
                    #EDF3FF
                );

            font-family: "Inter", sans-serif;

        }


        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

        }


        .login-container {

            width: 100%;

            max-width: 410px;

        }


        .logo {

            text-align: center;

            margin-bottom: 22px;

        }


        .logo img {

            width: 190px;

            height: 95px;

            object-fit: cover;

        }


        .login-card {

            background: white;

            border: 1px solid #E2E8F0;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 20px 60px rgba(15,23,42,.09);

        }


        .login-title {

            text-align: center;

            margin-bottom: 26px;

        }


        .login-title h1 {

            margin: 0;

            font-size: 23px;

            font-weight: 800;

            color: #0B1220;

        }


        .login-title p {

            margin: 7px 0 0;

            font-size: 13px;

            color: #64748B;

        }


        .campo {

            margin-bottom: 17px;

        }


        .form-label {

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 7px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-wrapper i {

            position: absolute;

            left: 13px;

            top: 50%;

            transform: translateY(-50%);

            color: var(--azul);

        }


        .form-control {

            height: 45px;

            padding-left: 40px;

            border: 1px solid #D6DEE9;

            border-radius: 8px;

            font-size: 13px;

        }


        .form-control:focus {

            border-color: var(--azul);

            box-shadow:
                0 0 0 3px rgba(0,80,224,.10);

        }


        .btn-login {

            width: 100%;

            height: 45px;

            border: none;

            border-radius: 8px;

            background: var(--azul);

            color: white;

            font-size: 13px;

            font-weight: 600;

            margin-top: 4px;

        }


        .btn-login:hover {

            background: var(--azul-forte);

            color: white;

        }


        .cadastro-link {

            margin-top: 21px;

            text-align: center;

            color: #64748B;

            font-size: 12px;

        }


        .cadastro-link a {

            color: var(--azul);

            font-weight: 700;

            text-decoration: none;

        }


        .alert {

            font-size: 12px;

        }

    </style>

</head>


<body>

<div class="login-page">

    <div class="login-container">


        <div class="logo">

            <img
                th:src="@{/images/logo.png}"
                alt="easycourty"
            >

        </div>


        <div class="login-card">


            <div class="login-title">

                <h1>
                    Bem-vindo ao easycourty
                </h1>

                <p>
                    Entre para gerenciar seus agendamentos.
                </p>

            </div>


            <div
                th:if="${param.error}"
                class="alert alert-danger"
            >
                E-mail ou senha inválidos.
            </div>


            <div
                th:if="${param.logout}"
                class="alert alert-success"
            >
                Você saiu da sua conta.
            </div>


            <form
                th:action="@{/login}"
                method="post"
            >


                <div class="campo">

                    <label
                        for="username"
                        class="form-label"
                    >
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>

                </div>


                <div class="campo">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >

                    Entrar

                </button>

            </form>


            <div class="cadastro-link">

                Ainda não possui uma conta?

                <a th:href="@{/cadastro}">
                    Criar conta
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
