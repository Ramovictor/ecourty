<!doctype html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    ```
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Histórico de Agendamentos - Ecourty</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    ```
  </head>

  <body class="bg-light">
    ```
    <!-- ====================================================== -->
    <!-- MENU SUPERIOR -->
    <!-- ====================================================== -->

    <div th:replace="~{fragments/header :: header}"></div>

    <!-- ====================================================== -->
    <!-- CONTEÚDO -->
    <!-- ====================================================== -->

    <div class="container mt-5">
      <!-- CABEÇALHO -->

      <div class="mb-4">
        <h1>Histórico de Agendamentos</h1>

        <p class="text-muted mb-0">
          Consulte os agendamentos que já foram realizados.
        </p>
      </div>

      <!-- ================================================== -->
      <!-- MENSAGEM SEM HISTÓRICO -->
      <!-- ================================================== -->

      <div th:if="${agendamentos.isEmpty()}" class="alert alert-info">
        Você ainda não possui agendamentos no histórico.
      </div>

      <!-- ================================================== -->
      <!-- LISTA DE AGENDAMENTOS -->
      <!-- ================================================== -->

      <div class="row">
        <div
          class="col-md-6 col-lg-4 mb-4"
          th:each="agendamento : ${agendamentos}"
        >
          <div class="card shadow border-0 h-100">
            <div class="card-body">
              <!-- CLIENTE -->

              <h4 class="card-title">
                <span th:text="${agendamento.cliente.nome}"> </span>
              </h4>

              <!-- QUADRA -->

              <p class="card-text">
                <strong>Quadra:</strong>

                <span th:text="${agendamento.quadra.nome}"> </span>
              </p>

              <!-- DATA -->

              <p class="card-text">
                <strong>Data:</strong>

                <span
                  th:text="${#temporals.format(agendamento.data, 'dd/MM/yyyy')}"
                >
                </span>
              </p>

              <!-- HORÁRIO -->

              <p class="card-text">
                <strong>Horário:</strong>

                <span
                  th:text="${#temporals.format(agendamento.horarioInicio, 'HH:mm')}"
                >
                </span>

                até

                <span
                  th:text="${#temporals.format(agendamento.horarioFim, 'HH:mm')}"
                >
                </span>
              </p>

              <!-- VALOR -->

              <p class="card-text">
                <strong>Valor:</strong>

                R$

                <span th:text="${agendamento.valor}"> </span>
              </p>

              <!-- PAGAMENTO -->

              <p class="card-text">
                <strong>Pagamento:</strong>

                <span
                  th:if="${agendamento.statusPagamento == 'Pago'}"
                  class="badge bg-success"
                >
                  Pago
                </span>

                <span
                  th:if="${agendamento.statusPagamento == 'Pendente'}"
                  class="badge bg-warning text-dark"
                >
                  Pendente
                </span>
              </p>

              <!-- INDICAÇÃO DE HISTÓRICO -->

              <div class="mt-3">
                <span class="badge bg-secondary"> Agendamento realizado </span>
              </div>

              <!-- ================================================== -->
              <!-- BOTÕES -->
              <!-- ================================================== -->

              <div class="d-flex gap-2 mt-3">
                <!-- EDITAR -->

                <button
                  type="button"
                  class="btn btn-primary btn-sm"
                  data-bs-toggle="modal"
                  th:attr="data-bs-target='#modalEditar' + ${agendamento.id}"
                >
                  Editar
                </button>

                <!-- EXCLUIR -->

                <a
                  th:href="@{/agendamentos/excluir/{id}(id=${agendamento.id})}"
                  class="btn btn-danger btn-sm"
                  onclick="
                    return confirm(
                      'Tem certeza que deseja excluir este agendamento?',
                    );
                  "
                >
                  Excluir
                </a>
              </div>
            </div>
          </div>

          <!-- ================================================== -->
          <!-- MODAL EDITAR -->
          <!-- ================================================== -->

          <div
            class="modal fade"
            th:id="'modalEditar' + ${agendamento.id}"
            tabindex="-1"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Editar Agendamento</h5>

                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                  ></button>
                </div>

                <form
                  th:action="@{/agendamentos/editar/{id}(id=${agendamento.id})}"
                  method="post"
                >
                  <div class="modal-body">
                    <!-- CLIENTE -->

                    <div class="mb-3">
                      <label class="form-label"> Cliente </label>

                      <select name="cliente.id" class="form-select" required>
                        <option
                          th:each="cliente : ${clientes}"
                          th:value="${cliente.id}"
                          th:text="${cliente.nome}"
                          th:selected="${cliente.id == agendamento.cliente.id}"
                        ></option>
                      </select>
                    </div>

                    <!-- QUADRA -->

                    <div class="mb-3">
                      <label class="form-label"> Quadra </label>

                      <select name="quadra.id" class="form-select" required>
                        <option
                          th:each="quadra : ${quadras}"
                          th:value="${quadra.id}"
                          th:text="${quadra.nome}"
                          th:selected="${quadra.id == agendamento.quadra.id}"
                        ></option>
                      </select>
                    </div>

                    <!-- DATA -->

                    <div class="mb-3">
                      <label class="form-label"> Data </label>

                      <input
                        type="date"
                        name="data"
                        class="form-control"
                        th:value="${agendamento.data}"
                        required
                      />
                    </div>

                    <!-- HORÁRIO INICIAL -->

                    <div class="mb-3">
                      <label class="form-label"> Horário inicial </label>

                      <input
                        type="time"
                        name="horarioInicio"
                        class="form-control"
                        th:value="${agendamento.horarioInicio}"
                        required
                      />
                    </div>

                    <!-- HORÁRIO FINAL -->

                    <div class="mb-3">
                      <label class="form-label"> Horário final </label>

                      <input
                        type="time"
                        name="horarioFim"
                        class="form-control"
                        th:value="${agendamento.horarioFim}"
                        required
                      />
                    </div>

                    <!-- VALOR -->

                    <div class="mb-3">
                      <label class="form-label"> Valor </label>

                      <input
                        type="number"
                        name="valor"
                        class="form-control"
                        step="0.01"
                        min="0"
                        th:value="${agendamento.valor}"
                        required
                      />
                    </div>

                    <!-- PAGAMENTO -->

                    <div class="mb-3">
                      <label class="form-label"> Status do pagamento </label>

                      <select
                        name="statusPagamento"
                        class="form-select"
                        required
                      >
                        <option
                          value="Pendente"
                          th:selected="${agendamento.statusPagamento == 'Pendente'}"
                        >
                          Pendente
                        </option>

                        <option
                          value="Pago"
                          th:selected="${agendamento.statusPagamento == 'Pago'}"
                        >
                          Pago
                        </option>
                      </select>
                    </div>
                  </div>

                  <!-- RODAPÉ -->

                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                      Salvar alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    ```
  </body>
</html>
