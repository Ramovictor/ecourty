<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Minhas Quadras - Ecourty</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- MENU -->

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1>Minhas Quadras</h1>

          <p class="text-muted mb-0">
            Olá,
            <span th:text="${usuario.nome}"></span>!
          </p>
        </div>

        <div>
          <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalCadastro"
          >
            + Cadastrar Quadra
          </button>
        </div>
      </div>

      <!-- MENSAGEM SE NÃO TIVER QUADRAS -->

      <div th:if="${quadras.isEmpty()}" class="alert alert-info">
        Você ainda não possui nenhuma quadra cadastrada.
      </div>

      <!-- LISTA DE QUADRAS -->

      <div class="row">
        <div class="col-md-4 mb-4" th:each="quadra : ${quadras}">
          <div class="card shadow border-0 h-100">
            <div class="card-body">
              <!-- NOME -->

              <h4 class="card-title" th:text="${quadra.nome}"></h4>

              <!-- TIPO -->

              <p class="card-text">
                <strong> Tipo: </strong>

                <span th:text="${quadra.tipo}"> </span>
              </p>

              <!-- VALOR -->

              <p class="card-text">
                <strong> Valor por hora: </strong>

                R$

                <span th:text="${quadra.valorPorHora}"> </span>
              </p>

              <!-- BOTÕES -->

              <div class="d-flex gap-2 mt-3">
                <!-- BOTÃO EDITAR -->

                <button
                  type="button"
                  class="btn btn-warning btn-sm"
                  data-bs-toggle="modal"
                  data-bs-target="#modalEditar"
                  th:attr="
                                data-id=${quadra.id},
                                data-nome=${quadra.nome},
                                data-tipo=${quadra.tipo},
                                data-valor=${quadra.valorPorHora}
                            "
                  onclick="abrirModalEditar(this)"
                >
                  Editar
                </button>

                <!-- BOTÃO EXCLUIR -->

                <a
                  th:href="@{/quadras/excluir/{id}(id=${quadra.id})}"
                  class="btn btn-danger btn-sm"
                >
                  Excluir
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL CADASTRAR QUADRA -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalCadastro"
      tabindex="-1"
      aria-labelledby="modalCadastroLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- CABEÇALHO -->

          <div class="modal-header">
            <h5 class="modal-title" id="modalCadastroLabel">
              Cadastrar Quadra
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- FORMULÁRIO -->

          <form action="/quadras/cadastro" method="post">
            <div class="modal-body">
              <!-- NOME -->

              <div class="mb-3">
                <label for="nomeCadastro" class="form-label">
                  Nome da quadra
                </label>

                <input
                  type="text"
                  id="nomeCadastro"
                  name="nome"
                  class="form-control"
                  placeholder="Ex: Quadra Principal"
                  required
                />
              </div>

              <!-- TIPO -->

              <div class="mb-3">
                <label for="tipoCadastro" class="form-label"> Tipo </label>

                <select
                  id="tipoCadastro"
                  name="tipo"
                  class="form-select"
                  required
                >
                  <option value="">Selecione o tipo</option>

                  <option value="Futebol">Futebol</option>

                  <option value="Futsal">Futsal</option>

                  <option value="Society">Society</option>

                  <option value="Basquete">Basquete</option>

                  <option value="Vôlei">Vôlei</option>

                  <option value="Tênis">Tênis</option>

                  <option value="Beach Tennis">Beach Tennis</option>

                  <option value="Outro">Outro</option>
                </select>
              </div>

              <!-- VALOR -->

              <div class="mb-3">
                <label for="valorCadastro" class="form-label">
                  Valor por hora
                </label>

                <div class="input-group">
                  <span class="input-group-text"> R$ </span>

                  <input
                    type="number"
                    id="valorCadastro"
                    name="valorPorHora"
                    class="form-control"
                    placeholder="0.00"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- RODAPÉ -->

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL EDITAR QUADRA -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalEditar"
      tabindex="-1"
      aria-labelledby="modalEditarLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- CABEÇALHO -->

          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarLabel">Editar Quadra</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- FORMULÁRIO -->

          <form id="formEditar" method="post">
            <div class="modal-body">
              <!-- NOME -->

              <div class="mb-3">
                <label for="nomeEditar" class="form-label">
                  Nome da quadra
                </label>

                <input
                  type="text"
                  id="nomeEditar"
                  name="nome"
                  class="form-control"
                  required
                />
              </div>

              <!-- TIPO -->

              <div class="mb-3">
                <label for="tipoEditar" class="form-label"> Tipo </label>

                <select
                  id="tipoEditar"
                  name="tipo"
                  class="form-select"
                  required
                >
                  <option value="Futebol">Futebol</option>

                  <option value="Futsal">Futsal</option>

                  <option value="Society">Society</option>

                  <option value="Basquete">Basquete</option>

                  <option value="Vôlei">Vôlei</option>

                  <option value="Tênis">Tênis</option>

                  <option value="Beach Tennis">Beach Tennis</option>

                  <option value="Outro">Outro</option>
                </select>
              </div>

              <!-- VALOR -->

              <div class="mb-3">
                <label for="valorEditar" class="form-label">
                  Valor por hora
                </label>

                <div class="input-group">
                  <span class="input-group-text"> R$ </span>

                  <input
                    type="number"
                    id="valorEditar"
                    name="valorPorHora"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- RODAPÉ -->

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-warning">
                Salvar alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- BOOTSTRAP JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT DO MODAL DE EDIÇÃO -->

    <script>
      function abrirModalEditar(botao) {
        const id = botao.getAttribute("data-id");

        const nome = botao.getAttribute("data-nome");

        const tipo = botao.getAttribute("data-tipo");

        const valor = botao.getAttribute("data-valor");

        // Preenche os campos

        document.getElementById("nomeEditar").value = nome;

        document.getElementById("tipoEditar").value = tipo;

        document.getElementById("valorEditar").value = valor;

        // Altera o endereço para onde o formulário será enviado

        document.getElementById("formEditar").action = "/quadras/editar/" + id;
      }
    </script>
  </body>
</html>
