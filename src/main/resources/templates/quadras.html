<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Quadras - Ecourty</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-5">

    <!-- CABEÇALHO -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Minhas Quadras
            </h1>

            <p class="text-muted mb-0">

                Olá,
                <span th:text="${usuario.nome}"></span>!

            </p>

        </div>

        <div class="d-flex gap-2">

            <!-- CLIENTES -->

            <a
                href="/clientes"
                class="btn btn-secondary">

                Meus Clientes

            </a>

            <!-- CADASTRAR QUADRA -->

            <a
                href="/quadras/cadastro"
                class="btn btn-primary">

                + Cadastrar Quadra

            </a>

        </div>

    </div>


    <!-- MENSAGEM CASO NÃO TENHA QUADRAS -->

    <div
        th:if="${quadras.isEmpty()}"
        class="alert alert-info">

        Você ainda não possui nenhuma quadra cadastrada.

    </div>


    <!-- LISTA DE QUADRAS -->

    <div class="row">

        <div
            class="col-md-4 mb-4"
            th:each="quadra : ${quadras}">

            <div class="card shadow border-0 h-100">

                <div class="card-body">

                    <!-- NOME -->

                    <h4
                        class="card-title"
                        th:text="${quadra.nome}">

                    </h4>


                    <!-- TIPO -->

                    <p class="card-text">

                        <strong>
                            Tipo:
                        </strong>

                        <span
                            th:text="${quadra.tipo}">

                        </span>

                    </p>


                    <!-- VALOR -->

                    <p class="card-text">

                        <strong>
                            Valor por hora:
                        </strong>

                        R$

                        <span
                            th:text="${quadra.valorPorHora}">

                        </span>

                    </p>


                    <!-- BOTÕES -->

                    <div class="d-flex gap-2 mt-3">

                        <!-- EDITAR -->

                        <a
                            th:href="@{/quadras/editar/{id}(id=${quadra.id})}"
                            class="btn btn-warning btn-sm">

                            Editar

                        </a>


                        <!-- EXCLUIR -->

                        <a
                            th:href="@{/quadras/excluir/{id}(id=${quadra.id})}"
                            class="btn btn-danger btn-sm">

                            Excluir

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- BOOTSTRAP JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

</body>

</html>
