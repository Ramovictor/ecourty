<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agendamentos - Ecourty</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- ====================================================== -->
    <!-- MENU SUPERIOR -->
    <!-- ====================================================== -->

    <div th:replace="~{fragments/header :: header}"></div>

    <!-- ====================================================== -->
    <!-- CONTEÚDO -->
    <!-- ====================================================== -->

    <div class="container mt-5">
      <!-- CABEÇALHO -->

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1>Meus Agendamentos</h1>

          <p class="text-muted mb-0">Gerencie os horários das suas quadras.</p>
        </div>

        <!-- BOTÃO NOVO AGENDAMENTO -->

        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#modalCadastroAgendamento"
        >
          + Novo Agendamento
        </button>
      </div>

      <!-- ================================================== -->
      <!-- MENSAGEM SEM AGENDAMENTOS -->
      <!-- ================================================== -->

      <div th:if="${agendamentos.isEmpty()}" class="alert alert-info">
        Você ainda não possui nenhum agendamento cadastrado.
      </div>

      <!-- ================================================== -->
      <!-- LISTA DE AGENDAMENTOS -->
      <!-- ================================================== -->

      <div class="row">
        <div
          class="col-md-6 col-lg-4 mb-4"
          th:each="agendamento : ${agendamentos}"
        >
          <div class="card shadow border-0 h-100">
            <div class="card-body">
              <!-- CLIENTE -->

              <h4 class="card-title">
                <span th:text="${agendamento.cliente.nome}"> </span>
              </h4>

              <!-- QUADRA -->

              <p class="card-text">
                <strong> Quadra: </strong>

                <span th:text="${agendamento.quadra.nome}"> </span>
              </p>

              <!-- DATA -->

              <p class="card-text">
                <strong> Data: </strong>

                <span
                  th:text="${#temporals.format(agendamento.data, 'dd/MM/yyyy')}"
                ></span>
              </p>

              <!-- HORÁRIO -->

              <p class="card-text">
                <strong> Horário: </strong>

                <span th:text="${agendamento.horarioInicio}"> </span>

                até

                <span th:text="${agendamento.horarioFim}"> </span>
              </p>

              <!-- VALOR -->

              <p class="card-text">
                <strong> Valor: </strong>

                R$

                <span th:text="${agendamento.valor}"> </span>
              </p>

              <!-- PAGAMENTO -->

              <p class="card-text">
                <strong> Pagamento: </strong>

                <span
                  th:if="${agendamento.statusPagamento == 'Pago'}"
                  class="badge bg-success"
                >
                  Pago
                </span>

                <span
                  th:if="${agendamento.statusPagamento == 'Pendente'}"
                  class="badge bg-warning text-dark"
                >
                  Pendente
                </span>
              </p>

              <!-- EXCLUIR -->

              <div class="mt-3 d-flex gap-2">
                <!-- EDITAR -->

                <button
                  type="button"
                  class="btn btn-warning btn-sm"
                  data-bs-toggle="modal"
                  data-bs-target="#modalEditarAgendamento"
                  th:attr="
            data-id=${agendamento.id},
            data-data=${agendamento.data},
            data-inicio=${agendamento.horarioInicio},
            data-fim=${agendamento.horarioFim},
            data-valor=${agendamento.valor},
            data-status=${agendamento.statusPagamento},
            data-cliente=${agendamento.cliente.id},
            data-quadra=${agendamento.quadra.id}
        "
                  onclick="abrirModalEditar(this)"
                >
                  Editar
                </button>

                <!-- EXCLUIR -->

                <a
                  th:href="@{/agendamentos/excluir/{id}(id=${agendamento.id})}"
                  class="btn btn-danger btn-sm"
                >
                  Excluir
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL CADASTRAR AGENDAMENTO -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalCadastroAgendamento"
      tabindex="-1"
      aria-labelledby="modalCadastroAgendamentoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <!-- CABEÇALHO DO MODAL -->

          <div class="modal-header">
            <h5 class="modal-title" id="modalCadastroAgendamentoLabel">
              Novo Agendamento
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- ================================================== -->
          <!-- FORMULÁRIO -->
          <!-- ================================================== -->

          <form action="/agendamentos/cadastro" method="post">
            <div class="modal-body">
              <div class="row">
                <!-- CLIENTE -->

                <div class="col-md-6 mb-3">
                  <label for="cliente" class="form-label"> Cliente </label>

                  <select
                    id="cliente"
                    name="cliente.id"
                    class="form-select"
                    required
                  >
                    <option value="">Selecione um cliente</option>

                    <option
                      th:each="cliente : ${clientes}"
                      th:value="${cliente.id}"
                      th:text="${cliente.nome}"
                    ></option>
                  </select>
                </div>

                <!-- QUADRA -->

                <div class="col-md-6 mb-3">
                  <label for="quadra" class="form-label"> Quadra </label>

                  <select
                    id="quadra"
                    name="quadra.id"
                    class="form-select"
                    required
                  >
                    <option value="">Selecione uma quadra</option>

                    <option
                      th:each="quadra : ${quadras}"
                      th:value="${quadra.id}"
                      th:text="${quadra.nome}"
                    ></option>
                  </select>
                </div>

                <!-- DATA -->

                <div class="col-md-4 mb-3">
                  <label for="data" class="form-label"> Data </label>

                  <input
                    type="date"
                    id="data"
                    name="data"
                    class="form-control"
                    required
                  />
                </div>

                <!-- HORÁRIO INÍCIO -->

                <div class="col-md-4 mb-3">
                  <label for="horarioInicio" class="form-label">
                    Horário de início
                  </label>

                  <input
                    type="time"
                    id="horarioInicio"
                    name="horarioInicio"
                    class="form-control"
                    required
                  />
                </div>

                <!-- HORÁRIO FIM -->

                <div class="col-md-4 mb-3">
                  <label for="horarioFim" class="form-label">
                    Horário de término
                  </label>

                  <input
                    type="time"
                    id="horarioFim"
                    name="horarioFim"
                    class="form-control"
                    required
                  />
                </div>

                <!-- VALOR -->

                <div class="col-md-6 mb-3">
                  <label for="valor" class="form-label"> Valor </label>

                  <div class="input-group">
                    <span class="input-group-text"> R$ </span>

                    <input
                      type="number"
                      id="valor"
                      name="valor"
                      class="form-control"
                      placeholder="0.00"
                      step="0.01"
                      min="0"
                      required
                    />
                  </div>
                </div>

                <!-- STATUS PAGAMENTO -->

                <div class="col-md-6 mb-3">
                  <label for="statusPagamento" class="form-label">
                    Status do pagamento
                  </label>

                  <select
                    id="statusPagamento"
                    name="statusPagamento"
                    class="form-select"
                    required
                  >
                    <option value="Pendente">Pendente</option>

                    <option value="Pago">Pago</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ================================================== -->
            <!-- RODAPÉ -->
            <!-- ================================================== -->

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary">
                Cadastrar Agendamento
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL EDITAR AGENDAMENTO -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalEditarAgendamento"
      tabindex="-1"
      aria-labelledby="modalEditarAgendamentoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarAgendamentoLabel">
              Editar Agendamento
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <form id="formEditarAgendamento" method="post">
            <div class="modal-body">
              <div class="row">
                <!-- CLIENTE -->

                <div class="col-md-6 mb-3">
                  <label for="clienteEditar" class="form-label">
                    Cliente
                  </label>

                  <select
                    id="clienteEditar"
                    name="cliente.id"
                    class="form-select"
                    required
                  >
                    <option value="">Selecione um cliente</option>

                    <option
                      th:each="cliente : ${clientes}"
                      th:value="${cliente.id}"
                      th:text="${cliente.nome}"
                    ></option>
                  </select>
                </div>

                <!-- QUADRA -->

                <div class="col-md-6 mb-3">
                  <label for="quadraEditar" class="form-label"> Quadra </label>

                  <select
                    id="quadraEditar"
                    name="quadra.id"
                    class="form-select"
                    required
                  >
                    <option value="">Selecione uma quadra</option>

                    <option
                      th:each="quadra : ${quadras}"
                      th:value="${quadra.id}"
                      th:text="${quadra.nome}"
                    ></option>
                  </select>
                </div>

                <!-- DATA -->

                <div class="col-md-4 mb-3">
                  <label for="dataEditar" class="form-label"> Data </label>

                  <input
                    type="date"
                    id="dataEditar"
                    name="data"
                    class="form-control"
                    required
                  />
                </div>

                <!-- INÍCIO -->

                <div class="col-md-4 mb-3">
                  <label for="inicioEditar" class="form-label">
                    Horário de início
                  </label>

                  <input
                    type="time"
                    id="inicioEditar"
                    name="horarioInicio"
                    class="form-control"
                    required
                  />
                </div>

                <!-- FIM -->

                <div class="col-md-4 mb-3">
                  <label for="fimEditar" class="form-label">
                    Horário de término
                  </label>

                  <input
                    type="time"
                    id="fimEditar"
                    name="horarioFim"
                    class="form-control"
                    required
                  />
                </div>

                <!-- VALOR -->

                <div class="col-md-6 mb-3">
                  <label for="valorEditar" class="form-label"> Valor </label>

                  <div class="input-group">
                    <span class="input-group-text"> R$ </span>

                    <input
                      type="number"
                      id="valorEditar"
                      name="valor"
                      class="form-control"
                      step="0.01"
                      min="0"
                      required
                    />
                  </div>
                </div>

                <!-- PAGAMENTO -->

                <div class="col-md-6 mb-3">
                  <label for="statusEditar" class="form-label">
                    Status do pagamento
                  </label>

                  <select
                    id="statusEditar"
                    name="statusPagamento"
                    class="form-select"
                    required
                  >
                    <option value="Pendente">Pendente</option>

                    <option value="Pago">Pago</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-warning">
                Salvar alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function abrirModalEditar(botao) {
        const id = botao.getAttribute("data-id");
        const data = botao.getAttribute("data-data");
        const inicio = botao.getAttribute("data-inicio");
        const fim = botao.getAttribute("data-fim");
        const valor = botao.getAttribute("data-valor");
        const status = botao.getAttribute("data-status");
        const cliente = botao.getAttribute("data-cliente");
        const quadra = botao.getAttribute("data-quadra");

        // Preenche os campos do modal

        document.getElementById("dataEditar").value = data;

        document.getElementById("inicioEditar").value = inicio;

        document.getElementById("fimEditar").value = fim;

        document.getElementById("valorEditar").value = valor;

        document.getElementById("statusEditar").value = status;

        document.getElementById("clienteEditar").value = cliente;

        document.getElementById("quadraEditar").value = quadra;

        // Define para qual endereço o formulário será enviado

        document.getElementById("formEditarAgendamento").action =
          "/agendamentos/editar/" + id;
      }
    </script>
  </body>
</html>
