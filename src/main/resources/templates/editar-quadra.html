<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Quadra - Ecourty</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Editar Quadra
                    </h2>

                    <form
                        th:action="@{/quadras/editar/{id}(id=${quadra.id})}"
                        method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Nome da quadra
                            </label>

                            <input
                                type="text"
                                name="nome"
                                class="form-control"
                                th:value="${quadra.nome}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Tipo de quadra
                            </label>

                            <select
                                name="tipo"
                                class="form-select"
                                required>

                                <option value="Futebol"
                                    th:selected="${quadra.tipo == 'Futebol'}">
                                    Futebol
                                </option>

                                <option value="Futsal"
                                    th:selected="${quadra.tipo == 'Futsal'}">
                                    Futsal
                                </option>

                                <option value="Basquete"
                                    th:selected="${quadra.tipo == 'Basquete'}">
                                    Basquete
                                </option>

                                <option value="Vôlei"
                                    th:selected="${quadra.tipo == 'Vôlei'}">
                                    Vôlei
                                </option>

                                <option value="Tênis"
                                    th:selected="${quadra.tipo == 'Tênis'}">
                                    Tênis
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Valor por hora
                            </label>

                            <input
                                type="number"
                                name="valorPorHora"
                                class="form-control"
                                step="0.01"
                                min="0"
                                th:value="${quadra.valorPorHora}"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Salvar Alterações

                            </button>

                        </div>

                    </form>

                    <div class="text-center mt-3">

                        <a href="/quadras">
                            Voltar para minhas quadras
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
