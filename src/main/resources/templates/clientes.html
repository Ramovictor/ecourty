<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meus Clientes - Ecourty</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- MENU SUPERIOR -->

    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTEÚDO -->

    <div class="container mt-5">
      <!-- CABEÇALHO -->

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1>Meus Clientes</h1>

          <p class="text-muted mb-0">Aqui estão seus clientes cadastrados.</p>
        </div>

        <!-- BOTÃO CADASTRAR CLIENTE -->

        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#modalCadastroCliente"
        >
          + Cadastrar Cliente
        </button>
      </div>

      <!-- MENSAGEM CASO NÃO TENHA CLIENTES -->

      <div th:if="${clientes.isEmpty()}" class="alert alert-info">
        Você ainda não possui nenhum cliente cadastrado.
      </div>

      <!-- LISTA DE CLIENTES -->

      <div class="row">
        <div class="col-md-4 mb-4" th:each="cliente : ${clientes}">
          <div class="card shadow border-0 h-100">
            <div class="card-body">
              <!-- NOME -->

              <h4 class="card-title" th:text="${cliente.nome}"></h4>

              <!-- TELEFONE -->

              <p class="card-text">
                <strong>Telefone:</strong>

                <span th:text="${cliente.telefone}"></span>
              </p>

              <!-- E-MAIL -->

              <p class="card-text">
                <strong>E-mail:</strong>

                <span th:text="${cliente.email}"></span>
              </p>

              <!-- BOTÕES -->

              <div class="d-flex gap-2 mt-3">
                <!-- EDITAR -->

                <button
                  type="button"
                  class="btn btn-warning btn-sm"
                  data-bs-toggle="modal"
                  data-bs-target="#modalEditarCliente"
                  th:attr="
                    data-id=${cliente.id},
                    data-nome=${cliente.nome},
                    data-telefone=${cliente.telefone},
                    data-email=${cliente.email}
                  "
                  onclick="abrirModalEditarCliente(this)"
                >
                  Editar
                </button>

                <!-- EXCLUIR -->

                <a
                  th:href="@{/clientes/excluir/{id}(id=${cliente.id})}"
                  class="btn btn-danger btn-sm"
                >
                  Excluir
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL CADASTRAR CLIENTE -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalCadastroCliente"
      tabindex="-1"
      aria-labelledby="modalCadastroClienteLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- CABEÇALHO -->

          <div class="modal-header">
            <h5 class="modal-title" id="modalCadastroClienteLabel">
              Cadastrar Cliente
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- FORMULÁRIO -->

          <form action="/clientes/cadastro" method="post">
            <div class="modal-body">
              <!-- NOME -->

              <div class="mb-3">
                <label for="nomeCliente" class="form-label">
                  Nome do cliente
                </label>

                <input
                  type="text"
                  id="nomeCliente"
                  name="nome"
                  class="form-control"
                  placeholder="Digite o nome do cliente"
                  required
                />
              </div>

              <!-- TELEFONE -->

              <div class="mb-3">
                <label for="telefoneCliente" class="form-label">
                  Telefone
                </label>

                <input
                  type="tel"
                  id="telefoneCliente"
                  name="telefone"
                  class="form-control"
                  placeholder="(00) 00000-0000"
                  required
                />
              </div>

              <!-- E-MAIL -->

              <div class="mb-3">
                <label for="emailCliente" class="form-label"> E-mail </label>

                <input
                  type="email"
                  id="emailCliente"
                  name="email"
                  class="form-control"
                  placeholder="cliente@email.com"
                  required
                />
              </div>
            </div>

            <!-- RODAPÉ -->

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary">
                Cadastrar Cliente
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- MODAL EDITAR CLIENTE -->
    <!-- ====================================================== -->

    <div
      class="modal fade"
      id="modalEditarCliente"
      tabindex="-1"
      aria-labelledby="modalEditarClienteLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- CABEÇALHO -->

          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarClienteLabel">
              Editar Cliente
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- FORMULÁRIO -->

          <form id="formEditarCliente" method="post">
            <div class="modal-body">
              <!-- NOME -->

              <div class="mb-3">
                <label for="nomeEditarCliente" class="form-label">
                  Nome do cliente
                </label>

                <input
                  type="text"
                  id="nomeEditarCliente"
                  name="nome"
                  class="form-control"
                  required
                />
              </div>

              <!-- TELEFONE -->

              <div class="mb-3">
                <label for="telefoneEditarCliente" class="form-label">
                  Telefone
                </label>

                <input
                  type="tel"
                  id="telefoneEditarCliente"
                  name="telefone"
                  class="form-control"
                  required
                />
              </div>

              <!-- E-MAIL -->

              <div class="mb-3">
                <label for="emailEditarCliente" class="form-label">
                  E-mail
                </label>

                <input
                  type="email"
                  id="emailEditarCliente"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
            </div>

            <!-- RODAPÉ -->

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-warning">
                Salvar alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- BOOTSTRAP JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT DO MODAL DE EDIÇÃO -->

    <script>
      function abrirModalEditarCliente(botao) {
        const id = botao.getAttribute("data-id");

        const nome = botao.getAttribute("data-nome");

        const telefone = botao.getAttribute("data-telefone");

        const email = botao.getAttribute("data-email");

        // Preenche os campos

        document.getElementById("nomeEditarCliente").value = nome;

        document.getElementById("telefoneEditarCliente").value = telefone;

        document.getElementById("emailEditarCliente").value = email;

        // Define para onde o formulário será enviado

        document.getElementById("formEditarCliente").action =
          "/clientes/editar/" + id;
      }
    </script>
  </body>
</html>
