<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Clientes - Ecourty</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Meus Clientes</h1>

            <p class="text-muted">
                Olá, <span th:text="${usuario.nome}"></span>!
            </p>

        </div>

        <div class="d-flex gap-2">

            <a
                href="/quadras"
                class="btn btn-secondary">

                Minhas Quadras

            </a>

            <a
                href="/clientes/cadastro"
                class="btn btn-primary">

                + Cadastrar Cliente

            </a>

        </div>

    </div>

    <div
        th:if="${clientes.isEmpty()}"
        class="alert alert-info">

        Você ainda não possui nenhum cliente cadastrado.

    </div>

    <div class="row">

        <div
            class="col-md-4 mb-4"
            th:each="cliente : ${clientes}">

            <div class="card shadow border-0 h-100">

                <div class="card-body">

                    <h4
                        class="card-title"
                        th:text="${cliente.nome}">
                    </h4>

                    <p class="card-text">

                        <strong>Telefone:</strong>

                        <span th:text="${cliente.telefone}">
                        </span>

                    </p>

                    <p class="card-text">

                        <strong>E-mail:</strong>

                        <span th:text="${cliente.email}">
                        </span>

                    </p>

                    <div class="mt-3">

                        <a
                            th:href="@{/clientes/excluir/{id}(id=${cliente.id})}"
                            class="btn btn-danger btn-sm">

                            Excluir

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
