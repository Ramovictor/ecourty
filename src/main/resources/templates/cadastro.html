<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - EasyCourty</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #0f1f3d;
        }

        .cadastro-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .cadastro-container {
            width: 100%;
            max-width: 430px;
        }

        .cadastro-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 12px 40px rgba(15, 31, 61, 0.10);
        }

        .cadastro-logo {
            display: block;
            width: 210px;
            max-width: 80%;
            margin: 0 auto 24px;
        }

        .cadastro-title {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .cadastro-subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            height: 46px;
            border: 1px solid #dce2ea;
            border-radius: 9px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .cadastro-button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .cadastro-button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #718096;
        }

        .login-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert-error {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
            border-radius: 8px;
            padding: 11px 13px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        @media (max-width: 480px) {

            .cadastro-card {
                padding: 28px 22px;
            }

            .cadastro-logo {
                width: 180px;
            }

        }

    </style>

</head>

<body>

<div class="cadastro-page">

    <div class="cadastro-container">

        <div class="cadastro-card">

            <!-- LOGO -->

            <img
                th:src="@{/images/logo.png}"
                src="/images/logo.png"
                alt="EasyCourty"
                class="cadastro-logo"
            >

            <h1 class="cadastro-title">
                Criar conta
            </h1>

            <p class="cadastro-subtitle">
                Cadastre-se para começar a gerenciar suas quadras
            </p>

            <!-- ERRO -->

            <div
                th:if="${erro}"
                class="alert-error"
                th:text="${erro}">
            </div>

            <!-- FORMULÁRIO -->

            <form
                action="/cadastro"
                method="post"
            >

                <!-- NOME -->

                <div class="form-group">

                    <label
                        for="nome"
                        class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <!-- E-MAIL -->

                <div class="form-group">

                    <label
                        for="email"
                        class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <!-- SENHA -->

                <div class="form-group">

                    <label
                        for="senha"
                        class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        class="form-control"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>

                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="cadastro-button"
                >
                    Criar minha conta
                </button>

            </form>

            <!-- ENTRAR -->

            <div class="login-link">

                Já possui uma conta?

                <a href="/">
                    Entrar
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
